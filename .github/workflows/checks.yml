name: Verificação
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Testes essenciais
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ranking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Somente fixture local efêmera do runner; nunca credencial de produção.
      TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/ranking_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py production.py storage.py postgres_storage.py ops integrations tests
      - run: node --check static/app.js
  release-approval:
    name: Integração aprovada em main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            if (`${owner}/${repo}` !== 'sousaweliton930-droid/ranking-do-detetive-novo') {
              core.setFailed('Repositório não autorizado.'); return;
            }
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: context.sha, per_page: 100
            });
            const approved = pulls.some(pr => pr.merged_at && pr.base.ref === 'main' &&
              pr.base.repo.full_name === `${owner}/${repo}` && pr.merge_commit_sha === context.sha);
            if (!approved) core.setFailed('Produção aceita apenas uma integração por pull request em main. Push direto não é uma aprovação.');
